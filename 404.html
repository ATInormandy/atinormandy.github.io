<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATI-Normandy</title>
<script>
/* Old addresses of the previous ati-normandy.fr site (/fr/..., /en/...) are sent to the matching page of this site.
   BASE is the folder the site is published in: "/" for https://atinormandy.github.io/ or https://ati-normandy.fr/.
   If the site is ever published as a project site (https://<account>.github.io/<repo>/), set BASE to "/<repo>/". */
(function () {
  var BASE = "/";
  var path = location.pathname;
  if (path.indexOf(BASE) === 0) path = "/" + path.slice(BASE.length);
  var m = path.match(/^\/(fr|en)(\/.*)?$/);
  var lang = m ? m[1] : null, rest = m ? (m[2] || "/") : path;
  var phase = (location.search.match(/phase=wp([123])/) || [])[1];
  var rules = [
    [/^\/?$/, ""],
    [/^\/project/, "projet"],
    [/^\/work-packages\/wp1\/datum/, "datum"],
    [/^\/work-packages/, (phase === "1" && location.hash === "#map") ? "cartographie" : "phase-" + (phase || "1")],
    [/^\/researchers/, "equipe"],
    [/^\/partners/, "partenaires"],
    [/^\/publications/, "publications"],
    [/^\/(agenda|events|news)/, "timeline"],
    [/^\/join/, "rejoindre"],
    [/^\/(contact|members)/, "contact"],
    [/^\/carte(\/|$)/, "cartographie"]
  ];
  for (var i = 0; i < rules.length; i++) {
    if (rules[i][0].test(rest)) {
      var target = BASE + (lang ? "?lang=" + lang : "") + (rules[i][1] ? "#" + rules[i][1] : "");
      if (target !== location.pathname + location.search + location.hash) location.replace(target);
      return;
    }
  }
  document.addEventListener("DOMContentLoaded", function () { var a = document.getElementById("home"); if (a) a.href = BASE; });
})();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F2F5F5; color: #17324A; font: 17px/1.6 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 34rem; padding: 24px; }
  h1 { font: 500 30px/1.2 Georgia, serif; margin: 0 0 12px; }
  a { color: #1C5FAF; }
</style>
</head>
<body>
<main>
  <h1>Page introuvable / Page not found</h1>
  <p>Cette adresse n'existe pas sur le site d'ATI-Normandy. This address does not exist on the ATI-Normandy site.</p>
  <p><a id="home" href="/">Retour à l'accueil / Back to the home page</a></p>
</main>
</body>
</html>
