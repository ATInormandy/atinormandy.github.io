# Pages CMS (https://pagescms.org): editing forms for the ATI-Normandy site.
# The lists shown on the site are kept in data/*.json; presentation figures and slides go in presentations/.
# Each save in Pages CMS is a commit to main, and GitHub Pages updates the site about a minute later.

media:
  - name: presentations
    label: Présentations (PDF, images)
    input: presentations
    output: /presentations
    extensions: [pdf, png, jpg, jpeg, webp]

content:
  - name: presentations
    label: Présentations / Presentations
    type: file
    path: data/presentations.json
    format: json
    fields:
      - name: items
        label: Présentations / Presentations
        description: "L'ordre de cette liste est celui du menu et de la page Présentations (faites glisser pour le changer). / The order of this list is the order of the menu and of the Presentations page (drag to change it)."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{author}: {title}"
        fields:
          - name: author
            label: Présentateur ou présentatrice / Presenter
            type: string
            required: true
            description: "Ex. : Asma Ouerhani. Affiché dans le menu avec le titre. / Shown in the menu with the title."
          - name: affiliation
            label: Affiliation
            type: string
            description: "Ex. : CREM, Université de Caen Normandie"
          - name: title
            label: Titre / Title
            type: string
            required: true
          - name: date
            label: Date
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: event_fr
            label: Événement (FR) / Event (FR)
            type: string
            description: "Ex. : Séminaire interne de l'équipe ATI-Normandy"
          - name: event_en
            label: Événement (EN) / Event (EN)
            type: string
            description: "Ex. : ATI-Normandy internal team seminar"
          - name: summary_fr
            label: Résumé court (FR) / Short summary (FR)
            type: text
            description: "Deux ou trois phrases, affichées dans la liste des présentations. / Two or three sentences, shown in the list of presentations."
          - name: summary_en
            label: Résumé court (EN) / Short summary (EN)
            type: text
          - name: body_fr
            label: Présentation en français / Presentation in French
            type: rich-text
            description: "Le contenu de la présentation : intertitres, paragraphes, listes et figures (insérez les images avec le bouton image). / The content of the presentation: headings, paragraphs, lists and figures (insert pictures with the image button)."
            options:
              format: html
              media: presentations
          - name: body_en
            label: Présentation en anglais / Presentation in English
            type: rich-text
            description: "Facultatif : sans texte anglais, le texte français est affiché. / Optional: without English text, the French text is shown."
            options:
              format: html
              media: presentations
          - name: pdf
            label: Diapositives en PDF / Slides as PDF
            type: file
            description: "Facultatif : un lien vers les diapositives apparaît en bas de la page. / Optional: a link to the slides appears at the bottom of the page."
            options:
              media: presentations
              extensions: [pdf]

  - name: publications
    label: Publications
    type: file
    path: data/publications.json
    format: json
    fields:
      - name: items
        label: Publications
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{year} {authors}: {title}"
        fields:
          - name: type
            label: Type
            type: select
            required: true
            options:
              values:
                - name: article
                  label: Article publié / Journal article
                - name: preprint
                  label: Préprint / Preprint
                - name: communication
                  label: Communication / Conference paper
          - name: authors
            label: Auteurs / Authors
            type: string
            required: true
            description: "Ex. : Danau D., Ouerhani A."
          - name: year
            label: Année / Year
            type: string
            required: true
          - name: title
            label: Titre / Title
            type: string
            required: true
          - name: url
            label: Lien vers le texte / Link to the paper
            type: string
            description: Facultatif. / Optional.
          - name: venue_fr
            label: Revue ou conférence (FR) / Journal or conference (FR)
            type: string
            description: "Ex. : ITEA, Bergame, juin 2026"
          - name: venue_en
            label: Revue ou conférence (EN) / Journal or conference (EN)
            type: string
            description: "Facultatif. Ex. : ITEA, Bergamo, June 2026 / Optional."
          - name: venue_url
            label: Lien vers la revue ou la conférence / Link to the journal or conference
            type: string
            description: Facultatif. / Optional.

  - name: datum
    label: Données (Datum)
    type: file
    path: data/datum.json
    format: json
    fields:
      - name: items
        label: Sources de données / Data sources
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: category
            label: Catégorie / Category
            type: select
            required: true
            options:
              values:
                - name: risques-naturels
                  label: Risques naturels / Natural hazards
                - name: geographie
                  label: Géographie et réseau routier / Geography and road network
                - name: transport
                  label: Transport
                - name: insee
                  label: INSEE
                - name: evaluation-economique
                  label: Évaluation économique / Economic appraisal
                - name: autre
                  label: Autre / Other
          - name: title
            label: Titre / Title
            type: string
            required: true
          - name: title_en
            label: Titre anglais, s'il est différent / English title, if different
            type: string
          - name: url
            label: Lien vers la source / Link to the source
            type: string
            required: true
          - name: description_fr
            label: Description (FR)
            type: text
          - name: description_en
            label: Description (EN)
            type: text

  - name: timeline
    label: Chronologie / Timeline
    type: file
    path: data/timeline.json
    format: json
    fields:
      - name: items
        label: Événements / Events
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date} {title_fr}"
        fields:
          - name: date
            label: Date (début) / Start date
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: end_date
            label: Date de fin / End date
            type: date
            default: ""
            description: Facultatif, pour un événement de plusieurs jours. / Optional, for an event over several days.
            options:
              format: yyyy-MM-dd
          - name: title_fr
            label: Titre (FR)
            type: string
            required: true
          - name: title_en
            label: Title (EN)
            type: string
          - name: text_fr
            label: Texte (FR)
            type: text
          - name: text_en
            label: Text (EN)
            type: text
          - name: link
            label: Lien / Link
            type: string
            description: "Facultatif : une adresse web, ou une page du site comme #presentations. / Optional: a web address, or a page of the site such as #presentations."
          - name: link_label_fr
            label: Texte du lien (FR)
            type: string
          - name: link_label_en
            label: Link text (EN)
            type: string
